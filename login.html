<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GO CIMA ADMIN - تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #171717;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #333;
      text-align: center;
    }

    h1 {
      color: #e50914;
      font-size: 32px;
      margin-bottom: 5px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      background: #252525;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.8;
    }

    .footer {
      color: #777;
      margin-top: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>GO CIMA</h1>
    <h2>🔐 لوحة تحكم الأدمن</h2>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button id="loginBtn" onclick="login()">
      تسجيل الدخول
    </button>

    <div id="message"></div>

    <div class="footer">
      GO CIMA ADMIN © 2026
    </div>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBXjotZW1_ETCuuh_AfjhHcu8ks9AFAtpM",
      authDomain: "go-cima.firebaseapp.com",
      projectId: "go-cima",
      storageBucket: "go-cima.firebasestorage.app",
      messagingSenderId: "45206357674",
      appId: "1:45206357674:web:74817b99fc601c8a11b2d3"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // حساب الأدمن الوحيد
    const ADMIN_UID = "MrUaVrnolANdWhf31lf8IJP0Zqr1";


    window.login = async function () {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      const button = document.getElementById("loginBtn");

      message.textContent = "";

      if (!email || !password) {
        message.style.color = "#ff7777";
        message.textContent = "من فضلك اكتب البريد الإلكتروني وكلمة المرور";
        return;
      }

      button.disabled = true;
      message.style.color = "white";
      message.textContent = "جاري تسجيل الدخول...";

      try {

        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (result.user.uid === ADMIN_UID) {

          message.style.color = "#00ff88";
          message.textContent = "مرحبًا بك في GO CIMA ADMIN ✅";

          setTimeout(function () {
            window.location.href = "admin.html";
          }, 1000);

        } else {

          await signOut(auth);

          message.style.color = "#ff4444";
          message.textContent =
            "⛔ هذا الحساب غير مسموح له بدخول لوحة التحكم";

        }

      } catch (error) {

        message.style.color = "#ff7777";
        message.textContent =
          "تعذر تسجيل الدخول. تأكد من البريد الإلكتروني وكلمة المرور.";

        console.error(error);

      } finally {

        button.disabled = false;

      }

    };

  </script>

</body>
      </html>
